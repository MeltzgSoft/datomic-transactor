name: Publish Docker Image

# Tag-driven: fires when a v#.#.# tag lands on GitHub via the Forgejo push
# mirror. PR CI on the forge cannot run docker (job containers get no docker
# socket), so it never exercises the built image. This workflow is where the
# real image is tested: build it, run the compose stack and smoke test against
# that exact image, and only then push it.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  IMAGE: vadercows/datomic-transactor

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be pointed at any ref; everything below assumes a v#.#.# tag.
      - name: Require a semantic-version tag ref
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::run this from a v#.#.# tag ref, not '$GITHUB_REF_NAME'"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v6
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build once and load into the local daemon as `datomic-transactor`, the
      # image name docker-compose.yml uses. Compose is then run without
      # --build so it tests this image rather than rebuilding its own.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: datomic-transactor:latest

      - name: Start the stack
        run: docker compose up -d --no-build
      - name: Wait for the transactor
        run: |
          for i in $(seq 1 60); do
            docker compose logs transactor 2>&1 | grep -q "System started" && exit 0
            sleep 2
          done
          echo "::error::transactor did not start"
          docker compose logs
          exit 1
      - name: Smoke test
        run: |
          docker compose build smoke-test
          docker compose run --rm smoke-test
      - name: Compose logs
        if: failure()
        run: docker compose logs

      # Only reached if the smoke test passed. Pushes the image that was tested.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push
        run: |
          docker tag datomic-transactor:latest "$IMAGE:latest"
          docker tag datomic-transactor:latest "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
