name: Publish Docker Image

# Tag-driven: fires when a v#.#.# tag lands on GitHub via the Forgejo push
# mirror. CI (tests) runs on the forge; this repo on GitHub is a read-only
# mirror whose only job is publishing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be pointed at any ref; everything below assumes a v#.#.# tag.
      - name: Require a semantic-version tag ref
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::run this from a v#.#.# tag ref, not '$GITHUB_REF_NAME'"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v6
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: vadercows/datomic-transactor:latest,vadercows/datomic-transactor:${{ env.VERSION }}
