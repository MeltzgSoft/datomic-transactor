services:
  postgres:
    image: postgres:16
    environment:
      # superuser, as in Datomic's docs; init-db creates the datomic db and role
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data  # in-memory; data is lost when the container is removed
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # one-shot: runs Datomic's bin/sql scripts, then exits
  init-db:
    build: .
    image: datomic-transactor
    command: init-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATOMIC_DB_HOST: postgres
      DATOMIC_ADMIN_USER: postgres
      DATOMIC_ADMIN_PASSWORD: postgres
      DATOMIC_DB_PASSWORD: datomic
    restart: "no"

  transactor:
    build: .
    image: datomic-transactor
    depends_on:
      init-db:
        condition: service_completed_successfully
    environment:
      DATOMIC_DB_HOST: postgres
      DATOMIC_DB_USER: datomic
      DATOMIC_DB_PASSWORD: datomic
      DATOMIC_ALT_HOST: transactor
      DATOMIC_PORT: ${DATOMIC_PORT:-4334}
      DATOMIC_LICENSE_KEY: ${DATOMIC_LICENSE_KEY:-}
    ports:
      - "${DATOMIC_PORT:-4334}:${DATOMIC_PORT:-4334}"

  # Stand-in for an external app (separate image, peer from Maven Central).
  # Run with: docker compose run --rm smoke-test   (needs the stack up)
  smoke-test:
    build: ./test
    profiles: ["test"]
    environment:
      # only Postgres is in the URI; the peer finds the transactor (alt-host:port) via storage
      DATOMIC_URI: datomic:sql://smoke-test?jdbc:postgresql://postgres:5432/datomic?user=datomic&password=datomic
    depends_on:
      - transactor
